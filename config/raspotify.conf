# Equalize's settings for Raspotify (librespot), the Spotify Connect speaker.
# install_pi.sh copies this to /etc/raspotify/conf.
#
# The Pi shows up in the Spotify app's device list as "Equalize". It makes
# no sound itself: librespot writes the music into a pipe that OwnTone plays
# on to your speakers over AirPlay 2 (choose them in Equalize's control
# panel), with an in-step copy for the LED panel.
LIBRESPOT_NAME="Equalize"
LIBRESPOT_DEVICE_TYPE=speaker
LIBRESPOT_BACKEND=pipe
LIBRESPOT_DEVICE=/srv/equalize/spotify
LIBRESPOT_FORMAT=S16
LIBRESPOT_BITRATE=320
LIBRESPOT_INITIAL_VOLUME=60
# Phone's volume slider turns the music down before it reaches the speakers.
LIBRESPOT_MIXER=softvol
LIBRESPOT_VOLUME_CTRL=log
