[DEFAULT]
# ---- LED matrix hardware ----
# Only read when the display program starts, so after changing anything here:
#     sudo systemctl restart equalize
#
# PANEL SIZE. Pick the block that matches your panel(s):
#
#   64 x 32  -- one 64x32 panel (wider than tall).
#              rows = 32   columns = 64   chain_length = 1
#
#   64 x 64  -- one 64x64 panel. Needs the bonnet's "E" address jumper
#              soldered (Adafruit's guide covers it).
#              rows = 64   columns = 64   chain_length = 1
#
#   128 x 64 -- two 64x64 panels side by side, the second plugged into the
#              first's output ("chained"). Also needs the E jumper. Or a single
#              128x64 panel sold as one piece -- same settings.
#              rows = 64   columns = 64   chain_length = 2
#
# The number of bars is chosen automatically from the width (16 on a
# 64-wide panel, 32 on 128) and can be changed in the web panel.
rows = 64
columns = 64
chain_length = 1

parallel = 1

# 'adafruit-hat'      -- the standard, no-soldering build.
# 'adafruit-hat-pwm'  -- ONLY after soldering the GPIO4-to-GPIO18 jumper on
#                        the bonnet (smoother, less flicker). Setting this
#                        without the wire gives a broken or blank panel.
hardware_mapping = adafruit-hat

# 1 is the library default. Pi 3 wants 2. A Pi 4 or 5 may need 3 or 4 --
# raise it if the panel shows tearing or garbage.
gpio_slowdown = 2

# Starting brightness 1-100. The live value is set from the web panel.
brightness = 60

# How often the LEDs refresh (Hz), and how many new equaliser pictures are
# drawn per second. 40 looks smooth; lower it if the Pi runs hot.
refresh_rate = 120
fps = 40
