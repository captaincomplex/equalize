# owntone.conf -- Equalize's settings for OwnTone, the Spotify Connect route.
#
#   Spotify app --(Spotify Connect: "Equalize")--> librespot (Raspotify)
#     --> /srv/equalize/spotify  (a named pipe OwnTone watches)
#     --> OwnTone --> your speakers over AirPlay 2
#               \--> /var/lib/equalize/owntone-out.fifo, held back to play in
#                    step with them --> Equalize draws it
#
# install_pi.sh copies this to /etc/owntone.conf. Choose which speakers play
# Spotify in Equalize's control panel (or OwnTone's own page, port 3689).

general {
	uid = "owntone"
	db_path = "/var/cache/owntone/songs3.db"
	logfile = "/var/log/owntone.log"
	loglevel = log
	# Only this house can change things.
	trusted_networks = { "lan" }
	# Spotify Connect is the only way in, so the library scan has one job.
	cache_dir = "/var/cache/owntone"
}

library {
	name = "Equalize"
	port = 3689
	# Only the pipe that librespot plays into: no music files.
	directories = { "/srv/equalize" }
	# Start playing as soon as librespot writes into the pipe.
	pipe_autostart = true
	pipe_sample_rate = 44100
	pipe_bits_per_sample = 16
	filescan_disable = false
}

# No local loudspeaker: the Pi makes no sound.
audio {
	nickname = "Pi (silent)"
	type = "disabled"
}

# The copy for the LED panel, in step with the speakers.
fifo {
	nickname = "Equalize panel"
	path = "/var/lib/equalize/owntone-out.fifo"
}

# The Pi's own AirPlay receiver (shairport-sync, also called "Equalize") must
# never be sent to: it would be the Pi playing to itself.
airplay "Equalize" {
	exclude = true
}

# Not used: OwnTone's own Spotify login (Spotify Connect goes through
# librespot instead) and the MPD remote-control protocol.
mpd {
	port = 0
}
