// Equalize's settings for shairport-sync (the AirPlay 2 receiver).
// install_pi.sh copies this to /etc/shairport-sync.conf.
// Full list of settings: /etc/shairport-sync.conf.sample
//
// What this does: the Pi appears as an AirPlay speaker called "Equalize".
// Whatever an iPhone/iPad/Mac/Apple TV sends it is "played" into the ALSA
// loopback -- a virtual cable inside the Pi -- where the Equalize display
// program picks it up. Nothing comes out of the Pi as sound.

general =
{
	name = "Equalize";              // the name shown in the AirPlay picker
	output_backend = "alsa";

	// Always receive at full level, whatever the phone's slider for this
	// "speaker" says. The bars scale themselves; a turned-down Equalize
	// slider would otherwise just make them shorter.
	ignore_volume_control = "yes";

	// Timing nudge, in seconds. Negative = bars earlier, positive = later.
	// The display adds roughly 50 ms of its own (reading the loopback, the
	// analysis window, drawing), so start slightly early. [Estimate: not
	// yet checked by eye against a real Sonos. Adjust, then:
	//     sudo systemctl restart shairport-sync ]
	audio_backend_latency_offset_in_seconds = -0.05;
};

alsa =
{
	// Must match LOOP_DEVICE / LOOP_RATE / LOOP_CHANNELS in
	// python/audio_source.py: both ends of the loopback have to agree.
	output_device = "hw:Loopback,0,0";
	output_rate = 48000;
	output_format = "S16_LE";
	output_channels = 2;
};

// Hand the LED panel to Equalize when AirPlay music starts, and back to
// Spotipi Photo once it has been quiet for active_state_timeout seconds.
// Does nothing unless Spotipi Photo is installed and sharing is on "Auto"
// (see /usr/local/bin/equalize-panel). shairport-sync runs as its own user,
// so these go through sudo, allowed by /etc/sudoers.d/equalize-panel.
sessioncontrol =
{
	run_this_before_entering_active_state = "/usr/bin/sudo -n /usr/local/bin/equalize-panel airplay-start";
	run_this_after_exiting_active_state = "/usr/bin/sudo -n /usr/local/bin/equalize-panel airplay-stop";
	active_state_timeout = 10.0;
};
